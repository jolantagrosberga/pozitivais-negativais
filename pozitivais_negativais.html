<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pozitīvais un Negatīvais Laukums – 7.3</title>
<style>
  :root {
    --sand: #E8DFD0; --sand-light: #F4EFE6; --sand-mid: #D4C9B5;
    --gray-light: #C8C2B8; --gray-mid: #8A8480; --gray-dark: #4A4642;
    --gray-deep: #2E2C2A; --white: #FAFAFA; --black: #111110; --accent: #7A6E60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'Candara', 'Calibri', 'Segoe UI', sans-serif; background: var(--sand-light); color: var(--gray-deep); }
  #app {
    position: absolute; top: 0; left: 0; width: 1600px; height: 900px;
    transform-origin: 0 0; overflow: hidden; background: var(--sand-light);
    display: grid; grid-template-columns: 370px 1fr;
  }
  /* ── LEFT PANEL ── */
  .side {
    background: var(--sand); border-right: 1px solid var(--sand-mid);
    padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;
  }
  h1 { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.25; }
  .sec { display: flex; flex-direction: column; gap: 7px; }
  .sec-label { font-size: 13px; color: var(--gray-mid); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row.fill > button { flex: 1; }
  button {
    cursor: pointer; border: 1.5px solid var(--gray-light); border-radius: 8px;
    background: var(--white); color: var(--gray-deep); font-family: inherit;
    font-size: 15px; padding: 8px 10px; transition: all 0.15s; white-space: nowrap;
  }
  button:hover { background: var(--sand-mid); border-color: var(--accent); }
  button.active { background: var(--gray-deep); color: var(--sand-light); border-color: var(--gray-deep); }
  .tab-btn.active { background: var(--accent); color: var(--sand-light); border-color: var(--accent); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .val { font-size: 15px; color: var(--gray-mid); min-width: 40px; text-align: right; }
  .sl-name { font-size: 14px; color: var(--gray-dark); min-width: 92px; }
  .sep { height: 1px; background: var(--sand-mid); }

  #escherPalette { display: none; }
  #escherPalette.visible { display: flex; }
  .esc-color-btn { width: 38px; height: 38px; border-radius: 50%; padding: 0; border: 2px solid var(--gray-light); flex: none !important; }
  .esc-color-btn.active { border-color: var(--accent); border-width: 4px; }
  .esc-black, .esc-black:hover { background: #111110; }
  .esc-white, .esc-white:hover { background: #FAFAFA; }
  .esc-gray, .esc-gray:hover  { background: #888; }

  #escherStamps { display: none; flex-direction: column; gap: 8px; }
  #escherStamps.visible { display: flex; }
  .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stamp-preview {
    height: 64px; border: 2px solid var(--gray-light); border-radius: 9px; background: var(--white);
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .stamp-preview:hover { border-color: var(--accent); background: var(--sand-mid); }
  .stamp-preview.active { border-color: var(--accent); border-width: 3px; background: var(--sand-mid); }
  .stamp-preview canvas { pointer-events: none; width: 46px; height: 46px; }

  .side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  #fsBtn { background: var(--gray-deep); color: var(--sand-light); border-color: var(--gray-deep); font-size: 16px; padding: 11px; }
  #fsBtn:hover { background: var(--accent); border-color: var(--accent); }

  /* ── CANVAS AREA ── */
  .main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px 20px; }
  .main-top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .orient-label { font-size: 14px; color: var(--gray-mid); text-transform: uppercase; letter-spacing: 0.05em; }
  .badge-row { display: flex; gap: 8px; }
  .badge { font-size: 13px; letter-spacing: 0.04em; padding: 4px 10px; border-radius: 12px; text-transform: uppercase; font-weight: 600; }
  .badge-white { background: var(--white); color: var(--gray-deep); border: 1px solid var(--gray-light); }
  .badge-black { background: var(--gray-deep); color: var(--sand-light); }
  .canvas-wrap { background: var(--sand-mid); border-radius: 14px; padding: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  #canvasContainer { display: flex; gap: 3px; border-radius: 8px; overflow: hidden; position: relative; user-select: none; }
  #canvasContainer.horizontal { flex-direction: row; }
  #canvasContainer.vertical { flex-direction: column; }
  canvas { display: block; }
  #canvasContainer canvas { touch-action: none; }
  .canvas-hint { font-size: 15px; color: var(--gray-dark); text-align: center; max-width: 1100px; line-height: 1.4; }

  #stampCursor { position: absolute; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); opacity: 0.7; display: none; }
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <h1>Pozitīvais &amp; Negatīvais Laukums</h1>

    <div class="sec">
      <span class="sec-label">Variants</span>
      <div class="row fill">
        <button class="tab-btn active" id="tab1">1 – Spogulis</button>
        <button class="tab-btn" id="tab2">2 – Brīvi</button>
        <button class="tab-btn" id="tab3">3 – Ešers</button>
      </div>
    </div>

    <div class="sec" id="orientSec">
      <span class="sec-label">Orientācija</span>
      <div class="row fill">
        <button class="tab-btn" id="orientH">↔ Horizontāla</button>
        <button class="tab-btn active" id="orientV">↕ Vertikāla</button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="sec">
      <span class="sec-label">Rīks</span>
      <div class="row fill">
        <button class="active" id="toolPencil">✏️ Zīmulis</button>
        <button id="toolBrush">🖌️ Ota</button>
        <button id="toolEraser">⬜ Dzēšgumija</button>
      </div>
      <div class="row">
        <span class="sl-name">Izmērs</span>
        <input type="range" id="sizeSlider" min="1" max="40" value="6">
        <span class="val" id="sizeLabel">6</span>
      </div>
    </div>

    <div class="sec">
      <div class="row" id="escherPalette">
        <span class="sl-name">Krāsa</span>
        <button class="esc-color-btn esc-black active" id="escBlack" title="Melns"></button>
        <button class="esc-color-btn esc-white" id="escWhite" title="Balts"></button>
        <button class="esc-color-btn esc-gray"  id="escGray"  title="Pelēks"></button>
      </div>
    </div>

    <div id="escherStamps">
      <span class="sec-label">Figūras</span>
      <div class="stamp-grid" id="stampGrid"></div>
      <div class="row">
        <span class="sl-name">Lielums</span>
        <input type="range" id="stampSize" min="20" max="200" value="80">
        <span class="val" id="stampSizeLabel">80</span>
      </div>
      <div class="row">
        <span class="sl-name">Pagrieziens</span>
        <input type="range" id="stampRot" min="0" max="359" value="0">
        <span class="val" id="stampRotLabel">0°</span>
      </div>
      <div class="row fill"><button id="toolStamp" class="tab-btn">🔵 Spiedogs</button></div>
    </div>

    <div class="side-bottom">
      <button id="clearBtn">🗑️ Notīrīt</button>
      <button id="fsBtn">⛶ Atvērt pilnekrānu</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-top" id="mainTop">
      <span class="orient-label" id="orientLabel">Vertikāla (balta augšpusē)</span>
      <div class="badge-row" id="badgeRow">
        <span class="badge badge-white" id="badgeLeft">Pozitīvs (balts fons)</span>
        <span class="badge badge-black" id="badgeRight">Negatīvs (melns fons) – automātiski</span>
      </div>
    </div>
    <div class="canvas-wrap">
      <div id="canvasContainer" class="vertical">
        <canvas id="canvasA"></canvas>
        <canvas id="canvasB"></canvas>
      </div>
    </div>
    <div class="canvas-hint" id="hintText">Zīmē augšējā (baltajā) daļā — apakšā automātiski parādās spoguļattēls pretējās krāsās.</div>
  </main>

  <!-- stamp cursor (inside #app, internal coordinates) -->
  <canvas id="stampCursor"></canvas>
</div>

<script>
// ══════════════════════════════════════════
//  SHAPE DEFINITIONS  (SVG paths, unit coords 0..1)
// ══════════════════════════════════════════
const SHAPES = [
  {
    id: 'rhombus',
    label: 'Rombs',
    draw(ctx, w, h, color) {
      ctx.beginPath();
      ctx.moveTo(w*0.5, h*0.04);
      ctx.lineTo(w*0.96, h*0.5);
      ctx.lineTo(w*0.5, h*0.96);
      ctx.lineTo(w*0.04, h*0.5);
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
    }
  },
  {
    id: 'bird',
    label: 'Putns',
    draw(ctx, w, h, color) {
      // Stylised flying bird (Escher-like)
      ctx.beginPath();
      // body
      ctx.moveTo(w*0.5, h*0.55);
      ctx.bezierCurveTo(w*0.35,h*0.42, w*0.1,h*0.38, w*0.03,h*0.45);
      ctx.bezierCurveTo(w*0.12,h*0.32, w*0.3,h*0.28, w*0.5,h*0.38);
      // right wing
      ctx.bezierCurveTo(w*0.7,h*0.28, w*0.88,h*0.32, w*0.97,h*0.45);
      ctx.bezierCurveTo(w*0.9,h*0.38, w*0.65,h*0.42, w*0.5,h*0.55);
      // tail
      ctx.bezierCurveTo(w*0.44,h*0.72, w*0.38,h*0.82, w*0.3,h*0.88);
      ctx.bezierCurveTo(w*0.42,h*0.78, w*0.5,h*0.68, w*0.5,h*0.55);
      ctx.bezierCurveTo(w*0.5,h*0.68, w*0.58,h*0.78, w*0.7,h*0.88);
      ctx.bezierCurveTo(w*0.62,h*0.82, w*0.56,h*0.72, w*0.5,h*0.55);
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
      // head
      ctx.beginPath();
      ctx.ellipse(w*0.5, h*0.28, w*0.1, h*0.1, 0, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
      // beak
      ctx.beginPath();
      ctx.moveTo(w*0.5, h*0.24);
      ctx.lineTo(w*0.62, h*0.22);
      ctx.lineTo(w*0.5, h*0.32);
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
    }
  },
  {
    id: 'fish',
    label: 'Zivs',
    draw(ctx, w, h, color) {
      ctx.beginPath();
      // body
      ctx.moveTo(w*0.82, h*0.5);
      ctx.bezierCurveTo(w*0.7,h*0.2, w*0.2,h*0.18, w*0.1,h*0.5);
      ctx.bezierCurveTo(w*0.2,h*0.82, w*0.7,h*0.8, w*0.82,h*0.5);
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
      // tail
      ctx.beginPath();
      ctx.moveTo(w*0.82, h*0.5);
      ctx.lineTo(w*0.97, h*0.28);
      ctx.lineTo(w*0.93, h*0.5);
      ctx.lineTo(w*0.97, h*0.72);
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
      // eye
      ctx.beginPath();
      ctx.arc(w*0.22, h*0.44, w*0.045, 0, Math.PI*2);
      const inv = color === '#111110' ? '#FAFAFA' : '#111110';
      ctx.fillStyle = inv; ctx.fill();
    }
  },
  {
    id: 'leaf',
    label: 'Lapa',
    draw(ctx, w, h, color) {
      // define leaf path helper
      function leafPath() {
        ctx.beginPath();
        ctx.moveTo(w*0.5, h*0.05);
        ctx.bezierCurveTo(w*0.9,h*0.1, w*0.95,h*0.6, w*0.5,h*0.95);
        ctx.bezierCurveTo(w*0.05,h*0.6, w*0.1,h*0.1, w*0.5,h*0.05);
        ctx.closePath();
      }
      leafPath();
      ctx.fillStyle = color; ctx.fill();
      // clip so veins stay inside
      ctx.save();
      leafPath();
      ctx.clip();
      const inv = color === '#111110' ? '#FAFAFA' : '#111110';
      ctx.strokeStyle = inv; ctx.lineWidth = w*0.025; ctx.lineCap = 'round';
      // midrib
      ctx.beginPath();
      ctx.moveTo(w*0.5, h*0.08);
      ctx.lineTo(w*0.5, h*0.9);
      ctx.stroke();
      // veins
      for(let i=1;i<=4;i++){
        const t = i*0.16+0.1;
        ctx.beginPath();
        ctx.moveTo(w*0.5, h*t);
        ctx.quadraticCurveTo(w*0.7, h*(t+0.06), w*0.78, h*(t+0.12));
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(w*0.5, h*t);
        ctx.quadraticCurveTo(w*0.3, h*(t+0.06), w*0.22, h*(t+0.12));
        ctx.stroke();
      }
      ctx.restore();
    }
  },
  {
    id: 'flower',
    label: 'Zieds',
    draw(ctx, w, h, color) {
      const cx=w*0.5, cy=h*0.5, r=w*0.22, pr=w*0.16;
      for(let i=0;i<6;i++){
        const a = i*Math.PI/3;
        ctx.beginPath();
        ctx.ellipse(cx+Math.cos(a)*r, cy+Math.sin(a)*r, pr, pr*0.5, a, 0, Math.PI*2);
        ctx.fillStyle = color; ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(cx, cy, w*0.18, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
      const inv = color === '#111110' ? '#FAFAFA' : '#111110';
      ctx.beginPath();
      ctx.arc(cx, cy, w*0.08, 0, Math.PI*2);
      ctx.fillStyle = inv; ctx.fill();
    }
  },
  {
    id: 'spider',
    label: 'Zirneklis',
    draw(ctx, w, h, color) {
      const cx=w*0.5, cy=h*0.54;
      const inv=color==='#111110'?'#FAFAFA':'#111110';
      ctx.fillStyle=color; ctx.strokeStyle=color;
      ctx.lineCap='round'; ctx.lineJoin='round';
      // 8 legs — 4 each side, curving outward
      const legData=[
        // [startAngle offset, ctrl1x, ctrl1y, endX, endY]  mirrored for right side
        [-0.38,-0.44, 0.12,0.46, -0.44,0.08,0.42],
        [-0.38,-0.38, 0.22,0.44, -0.38,0.18,0.46],
        [-0.38,-0.28, 0.34,0.40, -0.28,0.30,0.46],
        [-0.38,-0.18, 0.44,0.38, -0.18,0.40,0.44],
      ];
      // legs as bezier pairs L+R
      const legDefs=[
        // left side legs (from body left)
        {sx:cx-w*0.14,sy:cy-h*0.08, c1x:cx-w*0.42,c1y:cy-h*0.30, ex:cx-w*0.48,ey:cy-h*0.10},
        {sx:cx-w*0.14,sy:cy,        c1x:cx-w*0.46,c1y:cy-h*0.10, ex:cx-w*0.50,ey:cy+h*0.16},
        {sx:cx-w*0.14,sy:cy+h*0.08, c1x:cx-w*0.44,c1y:cy+h*0.14, ex:cx-w*0.46,ey:cy+h*0.36},
        {sx:cx-w*0.10,sy:cy+h*0.14, c1x:cx-w*0.34,c1y:cy+h*0.30, ex:cx-w*0.30,ey:cy+h*0.44},
      ];
      ctx.lineWidth=w*0.045;
      // draw 4 legs each side (mirror right)
      legDefs.forEach(({sx,sy,c1x,c1y,ex,ey})=>{
        // left
        ctx.beginPath(); ctx.moveTo(sx,sy);
        ctx.quadraticCurveTo(c1x,c1y,ex,ey); ctx.stroke();
        // right (mirror around cx)
        const rx=cx+(cx-sx), rc1x=cx+(cx-c1x), rex=cx+(cx-ex);
        ctx.beginPath(); ctx.moveTo(rx,sy);
        ctx.quadraticCurveTo(rc1x,c1y,rex,ey); ctx.stroke();
      });
      // abdomen (large rear oval)
      ctx.beginPath();
      ctx.ellipse(cx, cy+h*0.16, w*0.20, h*0.22, 0, 0, Math.PI*2);
      ctx.fill();
      // cephalothorax (front body)
      ctx.beginPath();
      ctx.ellipse(cx, cy-h*0.06, w*0.14, h*0.14, 0, 0, Math.PI*2);
      ctx.fill();
      // eyes — 4 pairs on cephalothorax
      const eyePositions=[[-0.07,-0.15],[0.07,-0.15],[-0.04,-0.20],[0.04,-0.20]];
      eyePositions.forEach(([dx,dy])=>{
        ctx.beginPath();
        ctx.arc(cx+w*dx, cy+h*dy, w*0.025, 0, Math.PI*2);
        ctx.fillStyle=inv; ctx.fill();
        ctx.fillStyle=color;
      });
    }
  },
  {
    id: 'star',
    label: 'Zvaigzne',
    draw(ctx, w, h, color) {
      const cx=w*0.5, cy=h*0.5, R=w*0.44, r=w*0.18, n=6;
      ctx.beginPath();
      for(let i=0;i<n*2;i++){
        const rad = (i*Math.PI/n) - Math.PI/2;
        const rr = i%2===0 ? R : r;
        i===0 ? ctx.moveTo(cx+rr*Math.cos(rad),cy+rr*Math.sin(rad))
               : ctx.lineTo(cx+rr*Math.cos(rad),cy+rr*Math.sin(rad));
      }
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
    }
  },
  {
    id: 'butterfly',
    label: 'Tauriņš',
    draw(ctx, w, h, color) {
      ctx.fillStyle = color;
      // upper wings
      ctx.beginPath();
      ctx.moveTo(w*0.5,h*0.4);
      ctx.bezierCurveTo(w*0.35,h*0.1,w*0.05,h*0.15,w*0.08,h*0.45);
      ctx.bezierCurveTo(w*0.1,h*0.62,w*0.38,h*0.58,w*0.5,h*0.5);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(w*0.5,h*0.4);
      ctx.bezierCurveTo(w*0.65,h*0.1,w*0.95,h*0.15,w*0.92,h*0.45);
      ctx.bezierCurveTo(w*0.9,h*0.62,w*0.62,h*0.58,w*0.5,h*0.5);
      ctx.closePath(); ctx.fill();
      // lower wings
      ctx.beginPath();
      ctx.moveTo(w*0.5,h*0.5);
      ctx.bezierCurveTo(w*0.3,h*0.55,w*0.08,h*0.72,w*0.15,h*0.88);
      ctx.bezierCurveTo(w*0.25,h*0.98,w*0.44,h*0.82,w*0.5,h*0.68);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(w*0.5,h*0.5);
      ctx.bezierCurveTo(w*0.7,h*0.55,w*0.92,h*0.72,w*0.85,h*0.88);
      ctx.bezierCurveTo(w*0.75,h*0.98,w*0.56,h*0.82,w*0.5,h*0.68);
      ctx.closePath(); ctx.fill();
      // body
      ctx.beginPath();
      ctx.ellipse(w*0.5,h*0.52,w*0.04,h*0.2,0,0,Math.PI*2);
      const inv=color==='#111110'?'#FAFAFA':'#111110';
      ctx.fillStyle=inv; ctx.fill();
    }
  }
];

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
const TOTAL_W = 1160, TOTAL_H = 740;   // zīmēšanas laukums (iekšējās 16:9 koordinātās)
const PREV = 92;                        // figūru priekšskatījuma izšķirtspēja
let orientation = 'vertical';
let variant = 1;
let tool = 'pencil';
let brushSize = 6;
let escherColor = '#111110';
let isDrawing = false;
let lastX = 0, lastY = 0;

// stamp state
let stampShapeId = null;
let stampSize = 80;
let stampRot = 0;

const canvasA = document.getElementById('canvasA');
const canvasB = document.getElementById('canvasB');
const ctxA = canvasA.getContext('2d');
const ctxB = canvasB.getContext('2d');
const container = document.getElementById('canvasContainer');
const stampCursorEl = document.getElementById('stampCursor');
const stampCursorCtx = stampCursorEl.getContext('2d');
const appEl = document.getElementById('app');
let APP_SCALE = 1;

// ── BUILD STAMP PANEL ──
function buildStampPanel() {
  const panel = document.getElementById('stampGrid');
  SHAPES.forEach(shape => {
    const btn = document.createElement('div');
    btn.className = 'stamp-preview';
    btn.title = shape.label;
    btn.dataset.id = shape.id;
    const previewC = document.createElement('canvas');
    previewC.width = PREV; previewC.height = PREV;
    const pCtx = previewC.getContext('2d');
    shape.draw(pCtx, PREV, PREV, '#2E2C2A');
    btn.appendChild(previewC);
    btn.addEventListener('click', () => selectStamp(shape.id));
    panel.appendChild(btn);
  });
}
buildStampPanel();

function selectStamp(id) {
  stampShapeId = id;
  tool = 'stamp';
  document.querySelectorAll('.stamp-preview').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.getElementById('toolStamp').classList.add('active');
  document.querySelectorAll('#toolPencil,#toolBrush,#toolEraser').forEach(b => b.classList.remove('active'));
  updateCursorCanvas();
}

// ── STAMP CURSOR CANVAS ──
function updateCursorCanvas() {
  if (!stampShapeId) return;
  const sz = stampSize;
  stampCursorEl.width = sz + 4;
  stampCursorEl.height = sz + 4;
  stampCursorCtx.clearRect(0, 0, sz+4, sz+4);
  stampCursorCtx.save();
  stampCursorCtx.translate((sz+4)/2, (sz+4)/2);
  stampCursorCtx.rotate(stampRot * Math.PI / 180);
  stampCursorCtx.translate(-(sz)/2, -(sz)/2);
  const shape = SHAPES.find(s => s.id === stampShapeId);
  if (shape) shape.draw(stampCursorCtx, sz, sz, escherColor);
  stampCursorCtx.restore();
}

document.addEventListener('mousemove', e => {
  const r = container.getBoundingClientRect();
  const inside = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
  if (tool === 'stamp' && stampShapeId && inside) {
    const ar = appEl.getBoundingClientRect();
    stampCursorEl.style.display = 'block';
    stampCursorEl.style.left = ((e.clientX - ar.left) / APP_SCALE) + 'px';
    stampCursorEl.style.top  = ((e.clientY - ar.top)  / APP_SCALE) + 'px';
  } else {
    stampCursorEl.style.display = 'none';
  }
});

// ── STAMP DRAW ──
function stampAt(ctx, cx, cy) {
  const shape = SHAPES.find(s => s.id === stampShapeId);
  if (!shape) return;
  const sz = stampSize;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(stampRot * Math.PI / 180);
  ctx.translate(-sz/2, -sz/2);
  shape.draw(ctx, sz, sz, escherColor);
  ctx.restore();
}

// ══════════════════════════════════════════
//  SIZING & BG
// ══════════════════════════════════════════
function setCanvasSizes() {
  const isV = orientation === 'vertical';
  if (variant === 3) {
    canvasA.width = TOTAL_W; canvasA.height = TOTAL_H;
    canvasB.style.display = 'none';
  } else {
    canvasB.style.display = 'block';
    if (isV) {
      canvasA.width = canvasB.width = TOTAL_W;
      canvasA.height = canvasB.height = TOTAL_H / 2;
    } else {
      canvasA.width = canvasB.width = TOTAL_W / 2;
      canvasA.height = canvasB.height = TOTAL_H;
    }
  }
  fillBG();
}
function fillBG() {
  if (variant === 3) {
    ctxA.fillStyle = '#888888';
    ctxA.fillRect(0, 0, canvasA.width, canvasA.height);
    return;
  }
  ctxA.fillStyle = '#FAFAFA';
  ctxA.fillRect(0, 0, canvasA.width, canvasA.height);
  ctxB.fillStyle = '#111110';
  ctxB.fillRect(0, 0, canvasB.width, canvasB.height);
}

// ══════════════════════════════════════════
//  MIRROR
// ══════════════════════════════════════════
function mirrorToB() {
  if (variant !== 1) return;
  const w = canvasA.width, h = canvasA.height;
  ctxB.save();
  ctxB.globalCompositeOperation = 'source-over';
  ctxB.globalAlpha = 1;
  ctxB.setTransform(1,0,0,1,0,0);
  if (orientation === 'horizontal') { ctxB.translate(w, 0); ctxB.scale(-1, 1); }
  else { ctxB.translate(0, h); ctxB.scale(1, -1); }
  ctxB.drawImage(canvasA, 0, 0);
  ctxB.setTransform(1,0,0,1,0,0);
  // invertē krāsas: balts – attēls = negatīvs
  ctxB.globalCompositeOperation = 'difference';
  ctxB.fillStyle = '#FFFFFF';
  ctxB.fillRect(0, 0, w, h);
  ctxB.restore();
}

// ══════════════════════════════════════════
//  DRAW
// ══════════════════════════════════════════
function getStrokeColor(canvas) {
  if (tool==='eraser') {
    if (variant===3) return '#888888';          // gray bg in Escher mode
    return canvas===canvasA ? '#FAFAFA' : '#111110';
  }
  if (variant===3) return escherColor;
  return canvas===canvasA ? '#111110' : '#FAFAFA';
}
function applyTool(ctx, canvas, x, y, isStart) {
  const color = getStrokeColor(canvas);
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle=color; ctx.fillStyle=color;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(tool==='pencil'){ ctx.lineWidth=brushSize*0.6; ctx.globalAlpha=1; }
  else if(tool==='brush'){ ctx.lineWidth=brushSize*1.5; ctx.globalAlpha=0.7; }
  else if(tool==='eraser'){ ctx.lineWidth=brushSize*2; ctx.globalAlpha=1; }
  if(isStart){
    ctx.beginPath();
    ctx.arc(x,y,ctx.lineWidth/2,0,Math.PI*2);
    ctx.fill(); ctx.globalAlpha=1; return;
  }
  ctx.globalAlpha = tool==='brush'?0.7:1;
  ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
}

function getCanvasCoords(e, canvas) {
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(cx-rect.left)*sx, y:(cy-rect.top)*sy};
}

function onDrawStart(e, canvas, ctx) {
  if(tool==='stamp'){
    if(stampShapeId){
      const {x,y}=getCanvasCoords(e,canvas);
      stampAt(ctx,x,y);
      if(variant===1&&canvas===canvasA) mirrorToB();
    }
    return;
  }
  isDrawing=true;
  const {x,y}=getCanvasCoords(e,canvas);
  lastX=x; lastY=y;
  applyTool(ctx,canvas,x,y,true);
  if(variant===1&&canvas===canvasA) mirrorToB();
}
function onDrawMove(e, canvas, ctx) {
  if(tool==='stamp') return;
  if(!isDrawing) return;
  e.preventDefault();
  const {x,y}=getCanvasCoords(e,canvas);
  applyTool(ctx,canvas,x,y,false);
  if(variant===1&&canvas===canvasA) mirrorToB();
  lastX=x; lastY=y;
}
function onDrawEnd() {
  isDrawing=false;
  if(variant===1) mirrorToB();
}

[[canvasA,ctxA],[canvasB,ctxB]].forEach(([cv,cx])=>{
  cv.addEventListener('mousedown',  e=>onDrawStart(e,cv,cx));
  cv.addEventListener('mousemove',  e=>onDrawMove(e,cv,cx));
  cv.addEventListener('mouseup',    onDrawEnd);
  cv.addEventListener('mouseleave', onDrawEnd);
  cv.addEventListener('touchstart', e=>onDrawStart(e,cv,cx),{passive:false});
  cv.addEventListener('touchmove',  e=>onDrawMove(e,cv,cx),{passive:false});
  cv.addEventListener('touchend',   onDrawEnd);
});

// ══════════════════════════════════════════
//  UI
// ══════════════════════════════════════════
function setTool(t) {
  tool = t;
  stampShapeId = null;
  document.querySelectorAll('.stamp-preview').forEach(b=>b.classList.remove('active'));
  document.getElementById('toolStamp').classList.remove('active');
  ['toolPencil','toolBrush','toolEraser'].forEach(id=>{
    document.getElementById(id).classList.toggle('active', id==='tool'+t.charAt(0).toUpperCase()+t.slice(1));
  });
  stampCursorEl.style.display='none';
}

document.getElementById('toolPencil').addEventListener('click',()=>setTool('pencil'));
document.getElementById('toolBrush').addEventListener('click', ()=>setTool('brush'));
document.getElementById('toolEraser').addEventListener('click',()=>setTool('eraser'));
document.getElementById('toolStamp').addEventListener('click', ()=>{
  if(SHAPES.length>0) selectStamp(SHAPES[0].id);
});

document.getElementById('sizeSlider').addEventListener('input',e=>{
  brushSize=parseInt(e.target.value);
  document.getElementById('sizeLabel').textContent=brushSize;
});
document.getElementById('stampSize').addEventListener('input',e=>{
  stampSize=parseInt(e.target.value);
  document.getElementById('stampSizeLabel').textContent=stampSize;
  updateCursorCanvas();
});
document.getElementById('stampRot').addEventListener('input',e=>{
  stampRot=parseInt(e.target.value);
  document.getElementById('stampRotLabel').textContent=stampRot+'°';
  updateCursorCanvas();
});

function updateVariant(v) {
  variant=v;
  document.querySelectorAll('.tab-btn[id^="tab"]').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+v).classList.add('active');
  const ep=document.getElementById('escherPalette');
  const es=document.getElementById('escherStamps');
  const br=document.getElementById('badgeRow');
  if(v===1){
    ep.classList.remove('visible'); es.classList.remove('visible');
    canvasB.style.pointerEvents='none'; br.style.display='flex';
    document.getElementById('badgeLeft').textContent='Pozitīvs (balts fons)';
    document.getElementById('badgeRight').textContent='Negatīvs (melns fons) – automātiski';
    document.getElementById('hintText').textContent=orientation==='horizontal'
      ?'Zīmē kreisajā (baltajā) daļā — labajā pusē automātiski parādās spoguļattēls pretējās krāsās.'
      :'Zīmē augšējā (baltajā) daļā — apakšā automātiski parādās spoguļattēls pretējās krāsās.';
    if(tool==='stamp') setTool('pencil');
  } else if(v===2){
    ep.classList.remove('visible'); es.classList.remove('visible');
    canvasB.style.pointerEvents='auto'; br.style.display='flex';
    document.getElementById('badgeLeft').textContent='Pozitīvs – balts fons, zīmē ar melnu';
    document.getElementById('badgeRight').textContent='Negatīvs – melns fons, zīmē ar baltu';
    document.getElementById('hintText').textContent='Zīmē abās daļās pats: baltajā – ar melnu, melnajā – ar baltu.';
    if(tool==='stamp') setTool('pencil');
  } else {
    ep.classList.add('visible'); es.classList.add('visible');
    canvasB.style.display='none'; br.style.display='none';
    document.getElementById('hintText').textContent='Ešera režīms – izvēlies figūru, krāsu, izmēru un pagriezienu, tad spied uz lapas, lai ieliktu figūru. Veido mozaīku, kur forma un fons mainās vietām.';
  }
  container.classList.toggle('escher-mode',v===3);
  document.getElementById('orientSec').style.display = v===3 ? 'none' : '';
  setCanvasSizes(); updateOrientLabel();
}

function updateOrientation(o){
  orientation=o;
  document.getElementById('orientH').classList.toggle('active',o==='horizontal');
  document.getElementById('orientV').classList.toggle('active',o==='vertical');
  container.classList.toggle('horizontal',o==='horizontal');
  container.classList.toggle('vertical',o==='vertical');
  setCanvasSizes(); updateOrientLabel();
  if(variant===1) mirrorToB();
}
function updateOrientLabel(){
  const el=document.getElementById('orientLabel');
  if(variant===3){el.textContent='Ešera mozaīka – viena lapa';return;}
  el.textContent=orientation==='vertical'
    ?'Vertikāla (balta augšpusē, melna apakšā)'
    :'Horizontāla (balta kreisajā pusē, melna labajā)';
}

function setEscherColor(c){
  escherColor=c;
  document.getElementById('escBlack').classList.toggle('active',c==='#111110');
  document.getElementById('escWhite').classList.toggle('active',c==='#FAFAFA');
  document.getElementById('escGray').classList.toggle('active', c==='#888888');
  updateCursorCanvas();
  // update stamp preview thumbnails
  document.querySelectorAll('.stamp-preview').forEach(btn=>{
    const shape=SHAPES.find(s=>s.id===btn.dataset.id);
    if(!shape) return;
    const pc=btn.querySelector('canvas');
    const pCtx=pc.getContext('2d');
    pCtx.clearRect(0,0,PREV,PREV);
    shape.draw(pCtx,PREV,PREV,c==='#888888'?'#2E2C2A':c);
  });
}

document.getElementById('escBlack').addEventListener('click',()=>setEscherColor('#111110'));
document.getElementById('escWhite').addEventListener('click',()=>setEscherColor('#FAFAFA'));
document.getElementById('escGray').addEventListener('click', ()=>setEscherColor('#888888'));

document.getElementById('tab1').addEventListener('click',()=>updateVariant(1));
document.getElementById('tab2').addEventListener('click',()=>updateVariant(2));
document.getElementById('tab3').addEventListener('click',()=>updateVariant(3));
document.getElementById('orientH').addEventListener('click',()=>updateOrientation('horizontal'));
document.getElementById('orientV').addEventListener('click',()=>updateOrientation('vertical'));

document.getElementById('clearBtn').addEventListener('click',()=>fillBG());

window.addEventListener('mouseup', ()=>{ if(isDrawing) onDrawEnd(); });

// ══════════════════════════════════════════
//  16:9 MĒROGOŠANA UN PILNEKRĀNS
// ══════════════════════════════════════════
function fitApp(){
  const W = window.innerWidth, H = window.innerHeight;
  APP_SCALE = Math.min(W/1600, H/900);
  appEl.style.transform = `scale(${APP_SCALE})`;
  appEl.style.left = Math.max(0,(W-1600*APP_SCALE)/2)+'px';
  appEl.style.top  = Math.max(0,(H-900*APP_SCALE)/2)+'px';
}
window.addEventListener('resize', fitApp);
fitApp();

const fsBtn = document.getElementById('fsBtn');
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fsFallback(){
  if (confirm('Pilnekrāna režīms šajā logā nav pieejams. Atvērt rīku jaunā cilnē?')) window.open(location.href, '_blank');
}
function toggleFullscreen(){
  const el = document.documentElement;
  try {
    if (isFullscreen()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(fsFallback);
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else fsFallback();
  } catch(err){ fsFallback(); }
}
function updateFsBtn(){
  fsBtn.textContent = isFullscreen() ? '✕ Iziet no pilnekrāna' : '⛶ Atvērt pilnekrānu';
  setTimeout(fitApp, 60);
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);

// ── INIT ──
updateVariant(1);
updateOrientation('vertical');
</script>
</body>
</html>
